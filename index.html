<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<title>プロセカ楽曲ルーレット</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f7f4;
    --surface: #ffffff;
    --ink: #292929;
    --sub: #777770;
    --line: #e6e6df;
    --accent: #6757a5;
    --accent-hover: #57488f;
    --soft: #f0eef7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    line-height: 1.6;
  }
  main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 48px; }
  header { margin: 0 0 22px; }
  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; margin: 0; }
  .lead { margin: 4px 0 0; color: var(--sub); font-size: .88rem; }
  .draw-area {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 24px 26px;
    text-align: center;
  }
  .result-label { color: var(--sub); font-size: .85rem; }
  #songTitle {
    min-height: 2.2em;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 12px 0 8px;
    font-size: clamp(1.7rem, 5.5vw, 2.55rem);
    font-weight: 750;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  #songMeta {
    min-height: 26px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 8px;
    color: var(--sub);
    font-size: .8rem;
  }
  .meta-item:not(:last-child)::after { content: "・"; margin-left: 8px; color: #c3c3bc; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
  }
  .draw-button {
    display: block;
    width: min(300px, 100%);
    margin: 24px auto 0;
    padding: 14px 20px;
    border: 0;
    background: var(--accent);
    color: white;
    font-size: 1.02rem;
    font-weight: 700;
    transition: background .15s ease;
  }
  .draw-button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .minor-actions { display: flex; justify-content: center; gap: 8px; margin-top: 13px; }
  .quiet-button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--sub);
    padding: 6px 11px;
    font-size: .78rem;
  }
  .quiet-button:hover { background: #f2f2ee; color: var(--ink); }
  #status { margin: 12px 0 0; min-height: 1.4em; color: var(--sub); font-size: .76rem; }
  .settings {
    margin-top: 26px;
    padding: 18px 20px 20px;
    border-top: 1px solid var(--line);
  }
  .settings-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  h2 { margin: 0; font-size: .95rem; font-weight: 700; }
  .settings-note { color: var(--sub); font-size: .75rem; }
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
  label { display: block; margin-bottom: 4px; color: var(--sub); font-size: .77rem; }
  select, input {
    width: 100%;
    min-width: 0;
    border: 1px solid #deded7;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    padding: 8px 9px;
    font: inherit;
    font-size: .85rem;
  }
  select:focus, input:focus, button:focus-visible { outline: 2px solid #a69bd0; outline-offset: 2px; }
  .range { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .history {
    margin-top: 16px;
    padding: 0 20px;
    color: var(--sub);
    font-size: .78rem;
  }
  .history summary { cursor: pointer; width: fit-content; }
  #historyList { margin: 8px 0 0; padding-left: 1.5rem; }
  footer { margin-top: 24px; text-align: center; color: #92928a; font-size: .7rem; }
  @media (max-width: 520px) {
    main { padding-top: 26px; }
    .draw-area { padding: 28px 16px 22px; }
    .filters { grid-template-columns: 1fr; gap: 10px; }
    .settings { padding-inline: 4px; }
    .history { padding-inline: 4px; }
  }
  .song-list {
  margin-top: 24px;
  padding: 18px 20px;
  border-top: 1px solid var(--line);
}

.song-list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.song-list-heading h2 {
  margin: 0;
  font-size: .95rem;
}

#songCount {
  color: var(--sub);
  font-size: .78rem;
}

#songList {
  border-top: 1px solid var(--line);
}

.song-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.song-item:hover {
  background: #f0eef7;
}

.song-item-name {
  font-size: .86rem;
  font-weight: 600;
}

.song-item-info {
  color: var(--sub);
  font-size: .72rem;
  text-align: right;
  flex-shrink: 0;
}

.song-empty {
  padding: 18px 4px;
  color: var(--sub);
  font-size: .82rem;
  text-align: center;
}
</style>
</head>
<body>
<main>
  <header>
    <h1>プロセカ楽曲ルーレット</h1>
    <p class="lead">条件を決めて、今日の一曲を選ぼう。</p>
  </header>

  <section class="draw-area" aria-live="polite">
    <div class="result-label">抽選結果</div>
    <div id="songTitle">ここに楽曲名が表示されます</div>
    <div id="songMeta"></div>
    <button class="draw-button" id="drawButton" disabled>データ読み込み中…</button>
    <div class="minor-actions">
      <button class="quiet-button" id="refreshButton">データを更新</button>
      <button class="quiet-button" id="resetButton">条件をリセット</button>
    </div>
    <p id="status" role="status">楽曲データを読み込んでいます。</p>
  </section>

  <section class="settings">
    <div class="settings-heading">
      <h2>抽選条件</h2>
      <span class="settings-note">指定しない項目はすべて対象</span>
    </div>
    <div class="filters">
      <div>
        <label for="difficulty">難易度</label>
        <select id="difficulty">
          <option value="">指定なし</option>
          <option value="easy">EASY</option>
          <option value="normal">NORMAL</option>
          <option value="hard">HARD</option>
          <option value="expert">EXPERT</option>
          <option value="master">MASTER</option>
          <option value="append">APPEND</option>
        </select>
      </div>
      <div>
        <label>レベル</label>
        <div class="range">
          <input id="levelMin" type="number" min="1" max="40" placeholder="下限">
          <input id="levelMax" type="number" min="1" max="40" placeholder="上限">
        </div>
      </div>
      <div>
        <label>BPM</label>
        <div class="range">
          <input id="bpmMin" type="number" min="1" placeholder="下限">
          <input id="bpmMax" type="number" min="1" placeholder="上限">
        </div>
      </div>
      <div>
        <label for="unit">ユニット</label>
        <select id="unit">
          <option value="">指定なし</option>
          <option value="piapro">バーチャル・シンガー</option>
          <option value="light_sound">Leo/need</option>
          <option value="idol">MORE MORE JUMP！</option>
          <option value="street">Vivid BAD SQUAD</option>
          <option value="theme_park">ワンダーランズ×ショウタイム</option>
          <option value="school_refusal">25時、ナイトコードで。</option>
        </select>
      </div>
    </div>
  </section>
  <section class="song-list">
  <div class="song-list-heading">
    <h2>条件に合う楽曲</h2>
    <span id="songCount">0曲</span>
  </div>
  <div id="songList"></div>
</section>

  <details class="history">
    <summary>抽選履歴</summary>
    <ol id="historyList"><li>まだ履歴はありません</li></ol>
    <button class="quiet-button" id="clearHistoryButton" style="margin-top:8px">履歴を消去</button>
  </details>

  <footer>
    非公式ファンツール / 楽曲データ：Sekai-World
  </footer>
</main>

<script>
"use strict";

const DATA_BASE = "https://raw.githubusercontent.com/Sekai-World/sekai-master-db-diff/main/";
const REFRESH_INTERVAL = 6 * 60 * 60 * 1000;
const DATA_FILES = {
  musics: "musics.json",
  difficulties: "musicDifficulties.json",
  vocals: "musicVocals.json",
  characters: "gameCharacters.json"
};

// BPMが分かる曲は { 楽曲ID: BPM } の形式で追加できます。
// 例: 1: 150,
const BPM_BY_MUSIC_ID = {};

const UNIT_NAMES = {
  piapro: "バーチャル・シンガー",
  light_sound: "Leo/need",
  idol: "MORE MORE JUMP！",
  street: "Vivid BAD SQUAD",
  theme_park: "ワンダーランズ×ショウタイム",
  school_refusal: "25時、ナイトコードで。"
};
const PROJECT_UNITS = ["light_sound", "idol", "street", "theme_park", "school_refusal"];
const $ = id => document.getElementById(id);

let songs = [];
let previousSongId = null;
let history = [];

async function fetchJson(file) {
  const url = new URL(file, DATA_BASE);
  url.searchParams.set("v", Date.now());
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${file} の取得に失敗しました（${response.status}）`);
  return response.json();
}

function createDifficultyMap(rows) {
  const map = new Map();
  for (const row of rows) {
    if (!map.has(row.musicId)) map.set(row.musicId, {});
    map.get(row.musicId)[String(row.musicDifficulty).toLowerCase()] = Number(row.playLevel);
  }
  return map;
}

function createCharacterMap(rows) {
  return new Map(rows.map(character => [character.id, character.unit]));
}

function getSongUnits(musicId, vocals, characterMap) {
  const related = vocals.filter(vocal => vocal.musicId === musicId);
  const sekai = related.filter(vocal => String(vocal.musicVocalType).toLowerCase().includes("sekai"));
  const original = related.filter(vocal => String(vocal.musicVocalType).toLowerCase().includes("original"));
  const selected = sekai.length ? sekai : original.length ? original : related;
  const units = new Set();
  let hasPiapro = false;

  for (const vocal of selected) {
    for (const singer of (vocal.characters || [])) {
      const type = String(singer.characterType || "").toLowerCase();
      if (type && !type.includes("game")) continue;
      const unit = characterMap.get(singer.characterId);
      if (unit === "piapro") hasPiapro = true;
      else if (PROJECT_UNITS.includes(unit)) units.add(unit);
    }
  }
  if (units.size) return [...units];
  return hasPiapro ? ["piapro"] : [];
}

async function loadSongs() {
  const drawButton = $("drawButton");
  drawButton.disabled = true;
  drawButton.textContent = "読み込み中…";
  $("status").textContent = "GitHubから楽曲データを取得しています。";

  try {
    const [musicRows, difficultyRows, vocalRows, characterRows] = await Promise.all([
      fetchJson(DATA_FILES.musics),
      fetchJson(DATA_FILES.difficulties),
      fetchJson(DATA_FILES.vocals),
      fetchJson(DATA_FILES.characters)
    ]);

    const difficultyMap = createDifficultyMap(difficultyRows);
    const characterMap = createCharacterMap(characterRows);

    songs = musicRows.map(music => ({
      id: music.id,
      title: music.title || `楽曲ID ${music.id}`,
      difficulties: difficultyMap.get(music.id) || {},
      bpm: BPM_BY_MUSIC_ID[music.id] ?? null,
      units: getSongUnits(music.id, vocalRows, characterMap)
    }));

    drawButton.textContent = "抽選する";
    updateCandidateCount();
  } catch (error) {
    $("status").textContent = `データを読み込めませんでした。時間をおいて再試行してください。\n${error.message}`;
    drawButton.textContent = "読み込み失敗";
  } finally {
    if (songs.length) drawButton.disabled = getCandidates().length === 0;
  }
}

function getNumber(id) {
  const value = $(id).value.trim();
  return value === "" ? null : Number(value);
}

function matchesRange(value, min, max) {
  return (min === null || value >= min) && (max === null || value <= max);
}

function getCandidates() {
  const difficulty = $("difficulty").value;
  const levelMin = getNumber("levelMin");
  const levelMax = getNumber("levelMax");
  const bpmMin = getNumber("bpmMin");
  const bpmMax = getNumber("bpmMax");
  const unit = $("unit").value;

  return songs.filter(song => {
    if (unit && !song.units.includes(unit)) return false;

    if (bpmMin !== null || bpmMax !== null) {
      if (song.bpm === null || !matchesRange(song.bpm, bpmMin, bpmMax)) return false;
    }

    if (difficulty) {
      const level = song.difficulties[difficulty];
      if (level === undefined || !matchesRange(level, levelMin, levelMax)) return false;
    } else if (levelMin !== null || levelMax !== null) {
      if (!Object.values(song.difficulties).some(level => matchesRange(level, levelMin, levelMax))) return false;
    }
    return true;
  });
}

function updateCandidateCount() {
  if (!songs.length) return;

  const count = getCandidates().length;

  $("status").textContent =
    `${songs.length.toLocaleString()}曲を読み込み済み / 条件に合う曲：${count.toLocaleString()}曲`;

  $("drawButton").disabled = count === 0;

  renderSongList();
}

  function renderSongList() {
  const candidates = getCandidates();
  const list = $("songList");

  $("songCount").textContent = `${candidates.length}曲`;
  list.replaceChildren();

  if (candidates.length === 0) {
    const empty = document.createElement("div");
    empty.className = "song-empty";
    empty.textContent = "条件に合う楽曲がありません。";
    list.append(empty);
    return;
  }

  for (const song of candidates) {
    const item = document.createElement("div");
    item.className = "song-item";

    const name = document.createElement("span");
    name.className = "song-item-name";
    name.textContent = song.title;

    const info = document.createElement("span");
    info.className = "song-item-info";

    const levels = Object.entries(song.difficulties)
      .map(([difficulty, level]) => `${difficulty.toUpperCase()} ${level}`)
      .join(" / ");

    info.textContent = levels;

    item.append(name, info);

    // 曲名をクリックすると、その曲を抽選結果に表示
    item.addEventListener("click", () => {
      previousSongId = song.id;
      showSong(song);
    });

    list.append(item);
  }
}


function showSong(song) {
  $("songTitle").textContent = song.title;
  const values = Object.entries(song.difficulties).map(([difficulty, level]) => `${difficulty.toUpperCase()} ${level}`);
  if (song.bpm !== null) values.push(`BPM ${song.bpm}`);
  values.push(...song.units.map(unit => UNIT_NAMES[unit]).filter(Boolean));

  $("songMeta").replaceChildren(...values.map(value => {
    const span = document.createElement("span");
    span.className = "meta-item";
    span.textContent = value;
    return span;
  }));
}

function drawSong() {
  const candidates = getCandidates();
  if (!candidates.length) {
    $("songTitle").textContent = "条件に合う曲がありません";
    $("songMeta").replaceChildren();
    return;
  }

  const pool = candidates.length > 1
    ? candidates.filter(song => song.id !== previousSongId)
    : candidates;
  const selected = pool[Math.floor(Math.random() * pool.length)];

  previousSongId = selected.id;
  showSong(selected);
  history.unshift(selected.title);
  history = history.slice(0, 15);
  renderHistory();
}

function renderHistory() {
  const list = $("historyList");
  list.replaceChildren();
  if (!history.length) {
    const item = document.createElement("li");
    item.textContent = "まだ履歴はありません";
    list.append(item);
    return;
  }
  for (const title of history) {
    const item = document.createElement("li");
    item.textContent = title;
    list.append(item);
  }
}

$("drawButton").addEventListener("click", drawSong);
$("refreshButton").addEventListener("click", loadSongs);
$("resetButton").addEventListener("click", () => {
  ["difficulty", "levelMin", "levelMax", "bpmMin", "bpmMax", "unit"].forEach(id => { $(id).value = ""; });
  updateCandidateCount();
});
$("clearHistoryButton").addEventListener("click", () => {
  history = [];
  renderHistory();
});
["difficulty", "levelMin", "levelMax", "bpmMin", "bpmMax", "unit"].forEach(id => {
  $(id).addEventListener("input", updateCandidateCount);
  $(id).addEventListener("change", updateCandidateCount);
});

loadSongs();
setInterval(loadSongs, REFRESH_INTERVAL);
</script>
</body>
</html>
